<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="same-origin">
<title>TekyPay — Panel de operación</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   PANEL DE OPERACIÓN · TEKYPAY
   Módulo 1: acceso, tablero y bandeja de solicitudes
   ============================================================ */
:root{
  --azul:#0047BA; --azul-osc:#003494; --azul-suave:#EAF1FD;
  --verde:#84BD00; --verde-osc:#5E8700; --verde-suave:#F1F8E0;
  --tinta:#2B2B2B; --gris:#5B6780; --gris-claro:#8A94A8;
  --linea:#DCE2EC; --fondo:#F4F6FA; --blanco:#FFFFFF;
  --rojo:#C62828; --rojo-suave:#FDECEC;
  --ambar:#B26A00; --ambar-suave:#FFF4E0;
  --radio:10px;
  --fuente:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--fuente);background:var(--fondo);color:var(--tinta);font-size:15px;line-height:1.45;min-height:100vh}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid rgba(0,71,186,.45);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── ACCESO ─────────────────────────────────────────────── */
.acceso{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 18px;
  background:linear-gradient(180deg,var(--azul-osc) 0,var(--azul) 44%,var(--fondo) 44%)}
.acceso-caja{width:100%;max-width:380px;background:var(--blanco);border-radius:16px;padding:28px 24px 24px;
  box-shadow:0 18px 40px -18px rgba(0,52,148,.45)}
.acceso-caja img{height:44px;display:block;margin-bottom:18px}
.acceso-caja h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
.acceso-caja p.sub{color:var(--gris);font-size:14px;margin:4px 0 22px}
.campo{margin-bottom:14px}
.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.campo input{width:100%;padding:12px 13px;border:1.5px solid var(--linea);border-radius:var(--radio);font-size:16px;background:var(--blanco)}
.campo input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,71,186,.12)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:none;border-radius:var(--radio);
  font-weight:700;padding:12px 18px;font-size:15px;transition:background .15s}
.btn-primario{background:var(--azul);color:#fff;width:100%;padding:14px}
.btn-primario:hover{background:var(--azul-osc)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-texto{background:none;color:var(--azul);padding:8px 10px}
.btn-texto:hover{background:var(--azul-suave)}
.aviso{border-radius:var(--radio);padding:11px 13px;font-size:14px;margin-bottom:14px}
.aviso-error{background:var(--rojo-suave);color:#8E1519;border:1.5px solid #E5A3A3}
.aviso-info{background:var(--azul-suave);color:#0B3A8C;border:1.5px solid #B9CFF3}
.acceso-pie{font-size:12px;color:var(--gris-claro);margin-top:18px;text-align:center}
.giro{width:16px;height:16px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

/* ── ESTRUCTURA ─────────────────────────────────────────── */
.barra{background:var(--blanco);border-bottom:3px solid var(--verde);position:sticky;top:0;z-index:20}
.barra-in{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 16px}
.barra img{height:30px;display:block}
.barra .titulo{font-weight:800;font-size:15px;color:var(--azul);white-space:nowrap}
.nav-sup{display:none;gap:4px;margin-left:12px}
.nav-sup a{text-decoration:none;color:var(--gris);font-weight:700;font-size:14px;padding:8px 12px;border-radius:8px}
.nav-sup a[aria-current="page"]{color:var(--azul);background:var(--azul-suave)}
.usuario{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--gris);min-width:0}
.usuario .nombre{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
main{max-width:1120px;margin:0 auto;padding:16px 16px 96px}

.nav-inf{position:fixed;bottom:0;left:0;right:0;background:var(--blanco);border-top:1px solid var(--linea);
  display:grid;grid-template-columns:repeat(3,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
.nav-inf a{text-decoration:none;color:var(--gris);font-size:12px;font-weight:700;display:flex;flex-direction:column;
  align-items:center;gap:3px;padding:9px 4px 10px}
.nav-inf a svg{width:22px;height:22px}
.nav-inf a[aria-current="page"]{color:var(--azul)}

@media (min-width:900px){
  .nav-sup{display:flex}
  .nav-inf{display:none}
  main{padding:24px 24px 48px}
  .usuario .nombre{max-width:220px}
}

.franja-prueba{background:var(--ambar-suave);color:var(--ambar);font-size:13px;font-weight:700;text-align:center;padding:7px 12px;border-bottom:1px solid #F1D29E}

/* ── RECORRIDO (el tablero) ─────────────────────────────── */
.recorrido{display:flex;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px;gap:0}
.recorrido::-webkit-scrollbar{display:none}
.etapa{flex:1 0 112px;border:none;background:var(--blanco);color:var(--azul);text-align:left;
  padding:12px 22px 12px 26px;margin-left:-10px;position:relative;
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%,14px 50%);
  transition:background .15s,color .15s}
.etapa:first-child{margin-left:0;padding-left:16px;border-radius:var(--radio) 0 0 var(--radio);
  clip-path:polygon(0 0,calc(100% - 14px) 0,100% 50%,calc(100% - 14px) 100%,0 100%)}
.etapa .cuenta{display:block;font-size:26px;font-weight:800;line-height:1.05}
.etapa .nom{display:block;font-size:12.5px;font-weight:700;color:var(--gris);white-space:nowrap}
.etapa:hover{background:var(--azul-suave)}
.etapa[aria-pressed="true"]{background:var(--azul);color:#fff}
.etapa[aria-pressed="true"] .nom{color:rgba(255,255,255,.85)}
.etapa.vacia .cuenta{color:var(--gris-claro)}
.etapa[aria-pressed="true"].vacia .cuenta{color:rgba(255,255,255,.7)}

.cerradas{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 0;align-items:center}
.cerradas .rotulo{font-size:13px;color:var(--gris);margin-right:2px}
.ficha-filtro{border:1.5px solid var(--linea);background:var(--blanco);border-radius:999px;padding:5px 12px;
  font-size:13px;font-weight:700;color:var(--gris)}
.ficha-filtro b{color:var(--tinta);margin-left:4px}
.ficha-filtro[aria-pressed="true"]{border-color:var(--azul);color:var(--azul);background:var(--azul-suave)}

.cifras{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 0 0;background:var(--blanco);
  border-radius:var(--radio);border:1px solid var(--linea)}
.cifra{padding:12px 12px 13px}
.cifra + .cifra{border-left:1px solid var(--linea)}
.cifra .v{font-size:18px;font-weight:800;display:block;line-height:1.2}
.cifra .l{font-size:12px;color:var(--gris);display:block}
.cifra.alerta .v{color:var(--rojo)}
@media (min-width:600px){.cifra{padding:14px 18px}.cifra .v{font-size:22px}.cifra .l{font-size:13px}}

/* ── HERRAMIENTAS DE LA BANDEJA ─────────────────────────── */
.herr{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 10px}
.herr h2{font-size:18px;font-weight:800;margin-right:auto}
.buscar{position:relative;flex:1 1 100%}
.buscar input{width:100%;padding:11px 12px 11px 38px;border:1.5px solid var(--linea);border-radius:var(--radio);font-size:16px;background:var(--blanco)}
.buscar input:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,71,186,.12)}
.buscar svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;color:var(--gris-claro)}
.interruptor{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gris);font-weight:700;user-select:none}
.interruptor input{appearance:none;width:38px;height:22px;border-radius:999px;background:var(--linea);position:relative;transition:background .15s;flex-shrink:0}
.interruptor input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.interruptor input:checked{background:var(--ambar)}
.interruptor input:checked::after{left:19px}
.meta-lista{font-size:13px;color:var(--gris);margin:0 0 8px}
.herr .interruptor{order:3}
.herr .buscar{order:2}
@media (min-width:900px){
  .herr .interruptor{order:0}
  .herr #btnActualizar{order:1}
  .herr .buscar{order:2;flex:0 1 340px}
}

/* ── LISTA DE SOLICITUDES ───────────────────────────────── */
.lista{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);overflow:hidden}
.fila{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:13px 14px;text-decoration:none;color:inherit;
  border-top:1px solid var(--linea)}
.fila:first-child{border-top:none}
.fila:hover{background:#F8FAFD}
.fila .quien{min-width:0}
.fila .nom-col,.fila .empresa{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .nom-col{font-weight:800;font-size:15px}
.fila .empresa{font-size:12.5px;color:var(--gris)}
.fila .monto{font-weight:800;text-align:right}
.fila .detalle{font-size:13px;color:var(--gris);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fila .lado{font-size:12.5px;color:var(--gris);text-align:right;white-space:nowrap}
.fila .marcas{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;align-items:center}
.folio{font-weight:700;color:var(--azul)}
.estado{font-size:12px;font-weight:800;border-radius:6px;padding:2px 8px}
.e-solicitada{background:var(--azul-suave);color:var(--azul)}
.e-aprobada{background:var(--verde-suave);color:var(--verde-osc)}
.e-formalizada{background:#E4ECFA;color:var(--azul-osc)}
.e-activa{background:var(--verde);color:#fff}
.e-liquidada{background:#ECEFF3;color:var(--gris)}
.e-rechazada{background:var(--rojo-suave);color:var(--rojo)}
.e-cancelada{background:#F3ECEC;color:#8A5A5A}
.marca-prueba{font-size:12px;font-weight:800;color:var(--ambar);background:var(--ambar-suave);border-radius:6px;padding:2px 8px}
.marca-atraso{font-size:12px;font-weight:800;color:var(--rojo)}
.marca-saldo{font-size:12.5px;color:var(--gris)}

@media (min-width:900px){
  .fila{grid-template-columns:110px minmax(0,1.3fr) minmax(0,1fr) 190px 130px;align-items:center;gap:0 16px;padding:12px 18px}
  .fila .c-folio{order:0}
  .fila .quien{order:1}
  .fila .detalle{order:2}
  .fila .marcas{order:3;grid-column:auto;margin:0}
  .fila .monto{order:4}
  .fila .lado{display:none}
  .encabezado-lista{display:grid!important}
}
.encabezado-lista{display:none;grid-template-columns:110px minmax(0,1.3fr) minmax(0,1fr) 190px 130px;gap:0 16px;
  padding:10px 18px;font-size:12.5px;font-weight:700;color:var(--gris);background:#F8FAFD;border-bottom:1px solid var(--linea)}
.encabezado-lista span:last-child{text-align:right}
.c-folio{display:none}
@media (min-width:900px){.c-folio{display:block;font-size:14px}[data-movil]{display:none}}

.vacio{padding:36px 20px;text-align:center;color:var(--gris)}
.vacio strong{display:block;color:var(--tinta);font-size:16px;margin-bottom:4px}
.cargando{padding:28px;text-align:center;color:var(--gris)}
.esqueleto{height:62px;border-top:1px solid var(--linea);background:linear-gradient(90deg,#fff 0,#F2F5FA 50%,#fff 100%);background-size:200% 100%;animation:brillo 1.2s linear infinite}
.esqueleto:first-child{border-top:none}
@keyframes brillo{to{background-position:-200% 0}}

/* ── FICHA DE SOLICITUD ────────────────────────────────── */
.ficha-enc{margin-bottom:14px}
.ficha-enc .fila-sup{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:4px}
.ficha-enc .folio-grande{font-size:24px;font-weight:800;color:var(--azul);letter-spacing:-.01em}
.ficha-enc h1{font-size:20px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.ficha-enc .sub{color:var(--gris);font-size:14px}
.acciones{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.btn-aprobar{background:var(--verde-osc);color:#fff}
.btn-aprobar:hover{background:#4E7100}
.btn-rechazar{background:var(--blanco);color:var(--rojo);border:1.5px solid #E5A3A3}
.btn-rechazar:hover{background:var(--rojo-suave)}
.btn-neutro{background:var(--blanco);color:var(--gris);border:1.5px solid var(--linea)}
.btn-neutro:hover{background:#F8FAFD}
.siguiente{font-size:14px;color:var(--gris);margin:6px 0 0}
.cierre{border-radius:var(--radio);padding:12px 14px;margin:12px 0 0;font-size:14px}
.cierre.rechazo{background:var(--rojo-suave);color:#8E1519}
.cierre.cancelacion{background:#F3ECEC;color:#6E4646}
.cierre.liquidacion{background:#ECEFF3;color:var(--gris)}

.rejilla{display:grid;gap:14px}
@media (min-width:900px){.rejilla{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.bloque{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--radio);padding:16px}
.bloque h2{font-size:15px;font-weight:800;margin-bottom:10px}
.bloque.destacado{border-color:#B9CFF3;box-shadow:inset 4px 0 0 var(--azul)}
.dato{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid #EEF1F6;font-size:14px}
.dato:first-of-type{border-top:none}
.dato .k{color:var(--gris)}
.dato .v{font-weight:700;text-align:right;overflow-wrap:anywhere}
.dato.total .v{color:var(--azul)}
.dato.alerta .v{color:var(--rojo)}
.nota{font-size:12.5px;color:var(--gris);margin-top:8px}

.medidor{margin:4px 0 12px}
.medidor .cifra-grande{font-size:28px;font-weight:800;line-height:1.1}
.medidor .cifra-grande small{font-size:14px;font-weight:700;color:var(--gris)}
.barra-cap{position:relative;height:10px;border-radius:6px;background:#EEF1F6;margin:10px 0 4px;overflow:visible}
.barra-cap .relleno{height:100%;border-radius:6px;background:var(--verde)}
.barra-cap .tope{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--tinta)}
.barra-cap-pie{display:flex;justify-content:space-between;font-size:12px;color:var(--gris)}
.nivel-ok .cifra-grande{color:var(--verde-osc)}
.nivel-cerca .cifra-grande{color:var(--ambar)} .nivel-cerca .relleno{background:#E09A2B}
.nivel-excede .cifra-grande{color:var(--rojo)} .nivel-excede .relleno{background:var(--rojo)}

.alerta-caja{background:var(--ambar-suave);color:#7A4A00;border-radius:8px;padding:9px 11px;font-size:13.5px;margin-bottom:10px}
.mini-lista a{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #EEF1F6;text-decoration:none;color:inherit;font-size:14px}
.mini-lista a:first-child{border-top:none}
.mini-lista a:hover .folio{text-decoration:underline}

details.plegable summary{cursor:pointer;font-weight:800;font-size:15px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.plegable summary::-webkit-details-marker{display:none}
details.plegable summary::after{content:"Mostrar";font-size:13px;color:var(--azul);font-weight:700}
details.plegable[open] summary::after{content:"Ocultar"}
details.plegable[open] summary{margin-bottom:10px}
.tabla-scroll{overflow-x:auto}
table.cuotas{width:100%;border-collapse:collapse;font-size:13.5px;min-width:360px}
table.cuotas th{text-align:left;color:var(--gris);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--linea)}
table.cuotas td{padding:7px 8px;border-bottom:1px solid #EEF1F6}
table.cuotas td.der,table.cuotas th.der{text-align:right}
.q-cubierta{color:var(--verde-osc);font-weight:700}
.q-vencida{color:var(--rojo);font-weight:700}
.q-parcial{color:var(--ambar);font-weight:700}
.q-pendiente,.q-proyeccion{color:var(--gris)}

.linea-tiempo{list-style:none}
.linea-tiempo li{position:relative;padding:0 0 14px 20px;font-size:14px}
.linea-tiempo li::before{content:"";position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--azul)}
.linea-tiempo li::after{content:"";position:absolute;left:7.5px;top:16px;bottom:0;width:1px;background:var(--linea)}
.linea-tiempo li:last-child::after{display:none}
.linea-tiempo .cuando{font-size:12.5px;color:var(--gris)}
.linea-tiempo .que{font-weight:700}
.linea-tiempo .por{color:var(--gris);font-size:13px}
.linea-tiempo .coment{font-size:13.5px;margin-top:2px;overflow-wrap:anywhere}

/* ── DIÁLOGO DE CONFIRMACIÓN ───────────────────────────── */
dialog.dlg{border:none;border-radius:14px;padding:0;width:min(460px,calc(100% - 24px));box-shadow:0 24px 60px rgba(0,0,0,.3)}
dialog.dlg::backdrop{background:rgba(20,30,50,.5)}
.dlg form{padding:20px}
.dlg h2{font-size:19px;font-weight:800;margin-bottom:6px}
.dlg .resumen{background:var(--fondo);border-radius:8px;padding:10px 12px;margin:10px 0 12px;font-size:14px}
.dlg .resumen div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.dlg .resumen span:first-child{color:var(--gris)}
.dlg .resumen span:last-child{font-weight:700;text-align:right}
.dlg label{display:block;font-size:13px;font-weight:700;margin:8px 0 6px}
.dlg textarea{width:100%;min-height:78px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:var(--radio);font:inherit;font-size:16px;resize:vertical}
.dlg textarea:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,71,186,.12)}
.dlg .rapidos{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.dlg .rapidos button{border:1.5px solid var(--linea);background:var(--blanco);border-radius:999px;padding:4px 10px;font-size:13px;color:var(--gris);font-weight:700}
.dlg .rapidos button:hover{border-color:var(--azul);color:var(--azul)}
.dlg .pie{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.dlg .err{color:var(--rojo);font-size:13.5px;margin-top:6px}
.dlg .entrada{width:100%;padding:11px 12px;border:1.5px solid var(--linea);border-radius:var(--radio);font:inherit;font-size:16px;background:var(--blanco)}
.dlg .entrada:focus{outline:none;border-color:var(--azul);box-shadow:0 0 0 3px rgba(0,71,186,.12)}
.dlg .check{display:flex;gap:10px;align-items:flex-start;font-weight:500;font-size:14.5px;margin:0 0 8px;padding:10px 12px;border:1.5px solid var(--linea);border-radius:var(--radio);cursor:pointer}
.dlg .check input{width:20px;height:20px;margin-top:1px;flex-shrink:0;accent-color:var(--verde-osc)}
.dlg .check:has(input:checked){border-color:var(--verde);background:var(--verde-suave)}
.dlg .vista-cal{background:var(--azul-suave);color:#0B3A8C;border-radius:8px;padding:9px 11px;font-size:13.5px;margin-top:8px}
.dlg .vista-cal b{font-weight:800}
.dlg .alerta-caja{margin:8px 0 0}
.dlg .rapidos button[aria-pressed="true"]{border-color:var(--azul);color:#fff;background:var(--azul)}
.btn-azul{background:var(--azul);color:#fff}
.btn-azul:hover{background:var(--azul-osc)}

/* ── PANTALLAS EN CONSTRUCCIÓN ─────────────────────────── */
.proximo{background:var(--blanco);border:1px dashed var(--linea);border-radius:var(--radio);padding:32px 22px;max-width:560px}

.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--tinta);color:#fff;
  padding:11px 16px;border-radius:var(--radio);font-size:14px;max-width:calc(100% - 32px);z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.error{background:#8E1519}
@media (min-width:900px){.toast{bottom:24px}}

.version{font-size:11px;color:var(--gris-claro);text-align:center;margin-top:28px}
</style>
</head>
<body>

<!-- ============================================================
     PANTALLA DE ACCESO
     ============================================================ -->
<section class="acceso" id="vistaAcceso" hidden>
  <form class="acceso-caja" id="formAcceso" novalidate>
    <img src="../img/TekyPayLogo.jpeg" alt="TekyPay">
    <h1>Panel de operación</h1>
    <p class="sub">Acceso exclusivo para el equipo de TekyPay.</p>
    <div class="aviso aviso-error" id="accesoError" role="alert" hidden></div>
    <div class="aviso aviso-info" id="accesoInfo" role="status" hidden></div>
    <div class="campo">
      <label for="correo">Correo</label>
      <input id="correo" type="email" autocomplete="username" inputmode="email" required>
    </div>
    <div class="campo">
      <label for="clave">Contraseña</label>
      <input id="clave" type="password" autocomplete="current-password" required>
    </div>
    <button class="btn btn-primario" id="btnEntrar" type="submit">Entrar</button>
    <p class="acceso-pie">¿Olvidaste tu contraseña? Solicítala al administrador del panel.</p>
  </form>
</section>

<!-- ============================================================
     APLICACIÓN
     ============================================================ -->
<div id="vistaApp" hidden>
  <header class="barra">
    <div class="barra-in">
      <img src="../img/TekyPayLogo.jpeg" alt="TekyPay">
      <span class="titulo">Operación</span>
      <nav class="nav-sup" aria-label="Secciones">
        <a href="#solicitudes" data-seccion="solicitudes">Solicitudes</a>
        <a href="#corte" data-seccion="corte">Corte</a>
        <a href="#cartera" data-seccion="cartera">Cartera</a>
      </nav>
      <div class="usuario">
        <span class="nombre" id="nombreOperador"></span>
        <button class="btn btn-texto" id="btnSalir" type="button">Salir</button>
      </div>
    </div>
  </header>
  <div class="franja-prueba" id="franjaPrueba" hidden>Estás viendo también los datos de prueba</div>

  <main id="contenido"></main>

  <nav class="nav-inf" aria-label="Secciones">
    <a href="#solicitudes" data-seccion="solicitudes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
      Solicitudes
    </a>
    <a href="#corte" data-seccion="corte">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4M8 14l2.5 2.5L16 13"/></svg>
      Corte
    </a>
    <a href="#cartera" data-seccion="cartera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      Cartera
    </a>
  </nav>
</div>

<div class="toast" id="toast" role="status" hidden></div>
<dialog class="dlg" id="dlg" aria-labelledby="dlgTitulo"></dialog>

<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============================================================
   CONFIGURACIÓN
   La llave es la pública. Esta página no puede leer ninguna
   tabla: todo pasa por funciones de la base que exigen una
   sesión de operador activo.
   ============================================================ */
const PANEL_VERSION = 'panel v1.2 — módulo 3';
const SUPABASE_URL  = 'https://fygespxcsymiccwixzdc.supabase.co';
const SUPABASE_KEY  = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZ5Z2VzcHhjc3ltaWNjd2l4emRjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEzNzYwMjUsImV4cCI6MjA5Njk1MjAyNX0.YfhTOZUa4PGLmo2Ic8xXLKwzFC5E904JjFZwk5kDDRI';
const MINUTOS_INACTIVIDAD = 30;

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, storageKey: 'tekypay-panel-sesion' }
});

/* ============================================================
   ESTADO DE LA PÁGINA
   ============================================================ */
const estado = {
  operador: null,
  incluirPrueba: false,          // apagado de inicio (acuerdo del status)
  filtroEstado: 'solicitada',    // la bandeja abre en lo pendiente de decidir
  buscar: '',
  resumen: null,
  bandeja: [],
};

const ETAPAS = [
  { id: 'solicitada',  nombre: 'Por decidir' },
  { id: 'aprobada',    nombre: 'Aprobadas' },
  { id: 'formalizada', nombre: 'Formalizadas' },
  { id: 'activa',      nombre: 'Activas' },
];
const CERRADAS = [
  { id: 'liquidada', nombre: 'Liquidadas' },
  { id: 'rechazada', nombre: 'Rechazadas' },
  { id: 'cancelada', nombre: 'Canceladas' },
];
const NOMBRE_ESTADO = {
  solicitada: 'Por decidir', aprobada: 'Aprobada', formalizada: 'Formalizada',
  activa: 'Activa', liquidada: 'Liquidada', rechazada: 'Rechazada', cancelada: 'Cancelada'
};

/* ============================================================
   UTILIDADES
   ============================================================ */
const $ = (sel, raiz = document) => raiz.querySelector(sel);

// Todo dato que viene de la base se escapa antes de pintarlo:
// los nombres los captura el público en el formulario de scoring.
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function mxn(n) {
  const v = Number(n) || 0;
  return (v < 0 ? '-$' : '$') + Math.abs(v).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function mxnCorto(n) {
  const v = Number(n) || 0;
  return '$' + v.toLocaleString('es-MX', { maximumFractionDigits: 0 });
}
function fecha(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'America/Mexico_City' });
}
function hace(iso) {
  if (!iso) return '';
  const dias = Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  if (dias <= 0) return 'hoy';
  if (dias === 1) return 'ayer';
  if (dias < 30) return 'hace ' + dias + ' días';
  return fecha(iso);
}
const PERIODO = { semanal: 'semanales', quincenal: 'quincenales', mensual: 'mensuales' };

let toastTimer;
function aviso(texto, tipo) {
  const t = $('#toast');
  t.textContent = texto;
  t.className = 'toast' + (tipo === 'error' ? ' error' : '');
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { t.hidden = true; }, tipo === 'error' ? 6000 : 3500);
}

/* ============================================================
   LLAMADAS A LA BASE
   Un solo punto de entrada. Traduce los errores a mensajes
   que un operador entienda y cierra la sesión si la base
   dice que ya no hay acceso.
   ============================================================ */
async function rpc(nombre, params) {
  let res;
  try {
    res = await db.rpc(nombre, params || {});
  } catch (e) {
    throw new Error('Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.');
  }
  if (res.error) {
    const msg = res.error.message || '';
    if (res.error.code === '42501' || /no autorizado|permission denied|JWT/i.test(msg)) {
      await cerrarSesion('Tu sesión ya no es válida. Vuelve a entrar.');
      throw new Error('Sesión no válida');
    }
    if (/Failed to fetch|NetworkError/i.test(msg)) {
      throw new Error('Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.');
    }
    // Las funciones del panel ya devuelven mensajes en español
    throw new Error(msg);
  }
  return res.data;
}

/* ============================================================
   ACCESO
   ============================================================ */
function mostrarAcceso(mensaje, tipo) {
  $('#vistaApp').hidden = true;
  $('#vistaAcceso').hidden = false;
  const err = $('#accesoError'), inf = $('#accesoInfo');
  err.hidden = inf.hidden = true;
  if (mensaje) {
    const el = tipo === 'info' ? inf : err;
    el.textContent = mensaje;
    el.hidden = false;
  }
  setTimeout(() => $('#correo').focus(), 50);
}

$('#formAcceso').addEventListener('submit', async (ev) => {
  ev.preventDefault();
  const correo = $('#correo').value.trim().toLowerCase();
  const clave  = $('#clave').value;
  const err = $('#accesoError');
  err.hidden = true; $('#accesoInfo').hidden = true;

  if (!correo || !clave) {
    err.textContent = 'Escribe tu correo y tu contraseña.';
    err.hidden = false;
    return;
  }

  const btn = $('#btnEntrar');
  btn.disabled = true;
  btn.innerHTML = '<span class="giro" aria-hidden="true"></span>Entrando';

  try {
    const { error } = await db.auth.signInWithPassword({ email: correo, password: clave });
    if (error) {
      const m = error.message || '';
      if (/Invalid login credentials/i.test(m))   throw new Error('Correo o contraseña incorrectos.');
      if (/Email not confirmed/i.test(m))         throw new Error('La cuenta no está confirmada. Pide al administrador que la confirme.');
      if (/rate limit|too many/i.test(m))         throw new Error('Demasiados intentos. Espera unos minutos y vuelve a intentarlo.');
      if (/fetch|network/i.test(m))               throw new Error('Sin conexión con el servidor. Revisa tu internet e inténtalo de nuevo.');
      throw new Error('No fue posible entrar: ' + m);
    }
    $('#clave').value = '';
    await entrar();
  } catch (e) {
    err.textContent = e.message;
    err.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Entrar';
  }
});

// Con sesión abierta, confirma que sea de un operador activo.
// Tener cuenta no basta: la lista de operadores la controla la base.
async function entrar() {
  let esOperador = false;
  try {
    esOperador = await rpc('fn_es_operador');
  } catch (e) {
    mostrarAcceso(e.message);
    return;
  }
  if (!esOperador) {
    await db.auth.signOut();
    mostrarAcceso('Esta cuenta no tiene acceso al panel. Pide al administrador que la habilite.');
    return;
  }

  const datos = await rpc('fn_panel_operador');
  estado.operador = (datos && datos[0]) ? datos[0].nombre : '';
  $('#nombreOperador').textContent = estado.operador;

  $('#vistaAcceso').hidden = true;
  $('#vistaApp').hidden = false;
  vigilarInactividad();
  if (!location.hash) location.hash = '#solicitudes';
  else enrutar();
}

async function cerrarSesion(mensaje) {
  clearTimeout(inactividadTimer);
  const dlg = $('#dlg'); if (dlg.open) dlg.close();
  estado.operador = null;
  estado.bandeja = [];
  estado.resumen = null;
  $('#contenido').innerHTML = '';
  $('#vistaApp').hidden = true;
  try { await db.auth.signOut(); } catch (e) { /* sin red: la sesión local se descarta igual */ }
  mostrarAcceso(mensaje, 'info');
}

$('#btnSalir').addEventListener('click', () => cerrarSesion('Sesión cerrada.'));

// Cierre por inactividad: el panel maneja datos personales y
// suele quedar abierto en equipos compartidos.
let inactividadTimer, vigilando = false;
function vigilarInactividad() {
  const reiniciar = () => {
    clearTimeout(inactividadTimer);
    inactividadTimer = setTimeout(() =>
      cerrarSesion('Cerramos tu sesión tras ' + MINUTOS_INACTIVIDAD + ' minutos sin actividad.'),
      MINUTOS_INACTIVIDAD * 60000);
  };
  if (!vigilando) {
    ['click', 'keydown', 'touchstart', 'scroll'].forEach(ev =>
      document.addEventListener(ev, reiniciar, { passive: true }));
    vigilando = true;
  }
  reiniciar();
}

/* ============================================================
   NAVEGACIÓN
   #solicitudes          bandeja (módulo 1)
   #solicitud/<id>       ficha (módulo 2)
   #corte                registro de cobros (módulo 4)
   #cartera              saldos y atrasos (módulo 5)
   ============================================================ */
function enrutar() {
  if ($('#vistaApp').hidden) return;
  const [seccion, param] = location.hash.replace(/^#/, '').split('/');
  const activa = (seccion === 'solicitud') ? 'solicitudes' : seccion;
  document.querySelectorAll('[data-seccion]').forEach(a => {
    if (a.dataset.seccion === activa) a.setAttribute('aria-current', 'page');
    else a.removeAttribute('aria-current');
  });
  window.scrollTo(0, 0);

  switch (seccion) {
    case 'solicitud': return vistaFicha(param);
    case 'corte':     return vistaPendiente('Corte de cobros',
      'Aquí registrarás, después de cada nómina, qué cobros aplicó Quentli y cuáles no.');
    case 'cartera':   return vistaPendiente('Cartera',
      'Aquí verás el saldo de cada crédito, los atrasos y el próximo cobro.');
    default:          return vistaSolicitudes();
  }
}
window.addEventListener('hashchange', enrutar);

function vistaPendiente(titulo, texto) {
  $('#contenido').innerHTML =
    '<div class="proximo"><h2>' + esc(titulo) + '</h2>' +
    '<p>' + esc(texto) + '</p>' +
    '<p>Esta sección se incorpora en un siguiente módulo del panel.</p></div>' +
    '<p class="version">' + PANEL_VERSION + '</p>';
}


/* ============================================================
   VISTA: FICHA DE LA SOLICITUD (módulo 2)
   ============================================================ */

// El scoring guarda en antiguedad_meses los PUNTOS del rango
// elegido, no los meses. Se traducen aquí a su rango.
const ANTIGUEDAD = { 3: 'Menos de 6 meses', 15: '6 a 12 meses', 25: '1 a 2 años', 35: '2 a 5 años', 45: 'Más de 5 años' };
const COBROS_AL_MES = { semanal: 4, quincenal: 2, mensual: 1 };   // mismo criterio que el simulador
const LIMITE_INGRESO = 0.30;
const VIGENTES = ['solicitada', 'aprobada', 'formalizada', 'activa'];
const NOMBRE_EVENTO = {
  aprobada: 'Aprobada', rechazada: 'Rechazada', formalizada: 'Formalizada',
  activa: 'Producto entregado', liquidada: 'Liquidada', cancelada: 'Cancelada'
};

let fichaActual = null;

function dato(k, v, clase) {
  return `<div class="dato ${clase || ''}"><span class="k">${k}</span><span class="v">${v}</span></div>`;
}
function fechaHora(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleString('es-MX', { day: '2-digit', month: 'short', year: 'numeric',
    hour: '2-digit', minute: '2-digit', timeZone: 'America/Mexico_City' });
}
function fechaCorta(yyyy_mm_dd) {
  if (!yyyy_mm_dd) return '';
  const [y, m, d] = String(yyyy_mm_dd).slice(0, 10).split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-MX', { day: '2-digit', month: 'short', year: 'numeric' });
}

async function vistaFicha(id) {
  const cont = $('#contenido');
  cont.innerHTML = `<a class="volver" href="#solicitudes">Volver a solicitudes</a>
    <div class="lista"><div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div></div>`;
  try {
    fichaActual = await rpc('fn_panel_ficha', { p_solicitud_id: id });
  } catch (e) {
    if (e.message === 'Sesión no válida') return;
    cont.innerHTML = `<a class="volver" href="#solicitudes">Volver a solicitudes</a>
      <div class="vacio lista"><strong>No se pudo abrir la solicitud</strong>${esc(e.message)}</div>`;
    return;
  }
  if (location.hash !== '#solicitud/' + id) return;   // el operador ya navegó a otra parte
  pintarFicha();
}

function pintarFicha() {
  const f = fichaActual;
  const s = f.solicitud, c = f.colaborador, emp = f.empresa || {};
  const cuotas = f.cuotas || [], eventos = f.eventos || [], cobros = f.cobros || [], otras = f.otras_solicitudes || [];

  // ── Capacidad de pago ──
  const factor   = COBROS_AL_MES[s.periodicidad] || 1;
  const pagoMes  = Number(s.pago_periodico) * factor;
  const ingreso  = Number(c.ingreso_mensual_neto) || 0;
  const gastos   = Number(c.gastos_mensuales) || 0;
  const pct      = ingreso > 0 ? pagoMes / ingreso : null;
  const libre    = ingreso - gastos;
  const pctLibre = libre > 0 ? pagoMes / libre : null;
  const alertaLibre = libre <= 0 || pctLibre > LIMITE_INGRESO;
  const nivelCap = pct === null ? '' : pct > LIMITE_INGRESO ? 'nivel-excede' : pct > 0.22 ? 'nivel-cerca' : 'nivel-ok';
  const escala   = 0.5;   // la barra llega a 50% del ingreso
  const anchoBarra = pct === null ? 0 : Math.min(pct / escala, 1) * 100;
  const leyendaCap = pct === null ? 'Sin ingreso registrado: no se puede calcular.'
    : pct > LIMITE_INGRESO ? 'Rebasa el límite del 30% del ingreso neto.'
    : pct > 0.22 ? 'Dentro del límite, cerca del 30%.'
    : 'Dentro del límite del 30% del ingreso neto.';

  // ── Otras solicitudes vigentes (Regla 4) ──
  const otrasVigentes = otras.filter(o => VIGENTES.includes(o.estado));

  // ── Acciones según estado ──
  let acciones = '', siguiente = '';
  if (s.estado === 'solicitada') {
    acciones = `
      <button class="btn btn-aprobar" type="button" data-accion="aprobar">Aprobar</button>
      <button class="btn btn-rechazar" type="button" data-accion="rechazar">Rechazar</button>
      <button class="btn btn-neutro" type="button" data-accion="cancelar">Cancelar solicitud</button>`;
  } else if (s.estado === 'aprobada') {
    acciones = `
      <button class="btn btn-azul" type="button" data-accion="formalizar">Formalizar</button>
      <button class="btn btn-neutro" type="button" data-accion="cancelar">Cancelar solicitud</button>`;
    siguiente = 'Siguiente paso: formalizar, una vez recibido el enganche y hecha el alta en Quentli.';
  } else if (s.estado === 'formalizada') {
    acciones = `
      <button class="btn btn-azul" type="button" data-accion="entregar">Registrar entrega</button>
      <button class="btn btn-neutro" type="button" data-accion="cancelar">Cancelar solicitud</button>`;
    siguiente = 'Los cobros ya cuentan para los cortes. Falta registrar la entrega del producto.';
  }

  let cierre = '';
  if (s.estado === 'rechazada')  cierre = `<div class="cierre rechazo"><strong>Rechazada.</strong> ${esc(s.motivo_rechazo)}</div>`;
  if (s.estado === 'cancelada')  cierre = `<div class="cierre cancelacion"><strong>Cancelada.</strong> ${esc(s.motivo_cancelacion)}</div>`;
  if (s.estado === 'liquidada')  cierre = `<div class="cierre liquidacion"><strong>Liquidada</strong> el ${fecha(s.cerrada_en)}.</div>`;

  const totalCobros = Number(s.pago_periodico) * Number(s.numero_pagos);
  const esProyeccion = cuotas.length && cuotas.every(q => q.es_proyeccion);

  // ── Historial ──
  const historial = [
    { cuando: s.fecha_solicitud, que: 'Solicitud generada', por: 'por el colaborador', coment: '' },
    ...eventos.map(e => ({ cuando: e.creado_en,
                           que: e.estado_anterior === 'liquidada' ? 'Reabierta' : (NOMBRE_EVENTO[e.estado_nuevo] || e.estado_nuevo),
                           por: e.operador ? 'por ' + e.operador : '', coment: e.comentario || '' }))
  ].reverse();

  $('#contenido').innerHTML = `
    <a class="volver" href="#solicitudes">Volver a solicitudes</a>

    <div class="ficha-enc">
      <div class="fila-sup">
        <span class="folio-grande num">${esc(s.folio)}</span>
        <span class="estado e-${esc(s.estado)}">${NOMBRE_ESTADO[s.estado] || esc(s.estado)}</span>
        ${s.es_prueba ? '<span class="marca-prueba">Prueba</span>' : ''}
      </div>
      <h1>${esc(c.nombre_completo)}</h1>
      <div class="sub">${esc(emp.nombre || 'Empresa sin nombre')}. Solicitó ${esc(s.producto)} el ${fecha(s.fecha_solicitud)}.</div>
      ${acciones ? `<div class="acciones">${acciones}</div>` : ''}
      ${siguiente ? `<p class="siguiente">${siguiente}</p>` : ''}
      ${cierre}
    </div>

    <div class="rejilla">
      <div class="rejilla" style="grid-template-columns:minmax(0,1fr)">

        <section class="bloque ${s.estado === 'solicitada' ? 'destacado' : ''}">
          <h2>Capacidad de pago</h2>
          <div class="medidor ${nivelCap}">
            <div class="cifra-grande num">${pct === null ? '–' : (pct * 100).toFixed(1) + '%'} <small>del ingreso neto</small></div>
            <div class="barra-cap" aria-hidden="true">
              <div class="relleno" style="width:${anchoBarra}%"></div>
              <div class="tope" style="left:${LIMITE_INGRESO / escala * 100}%"></div>
            </div>
            <div class="barra-cap-pie"><span>0%</span><span>Límite 30%</span><span>50%</span></div>
            <p class="nota">${leyendaCap}</p>
          </div>
          ${dato('Pago mensual equivalente', mxn(pagoMes))}
          ${dato('Ingreso mensual neto', ingreso ? mxn(ingreso) : 'Sin dato')}
          ${dato('Gastos mensuales declarados', mxn(gastos))}

/* ── Fechas: réplica de la base ──────────────────────────────
   fechaCuota() reproduce exactamente fn_fecha_cuota (parche 1).
   Se verificó contra la base en 118,368 combinaciones: la vista
   previa que ve el operador es la misma que se guarda.         */
function ultimoDia(y, m0) { return new Date(y, m0 + 1, 0).getDate(); }
function isoLocal(f) {
  return f.getFullYear() + '-' + String(f.getMonth() + 1).padStart(2, '0') + '-' + String(f.getDate()).padStart(2, '0');
}
function hoyMX() {
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Mexico_City' }).format(new Date());
}
function sumarDias(iso, dias) {
  const [y, m, d] = iso.split('-').map(Number);
  return isoLocal(new Date(y, m - 1, d + dias));
}
function fechaCuota(inicio, per, n) {
  const [y, m, d] = inicio.split('-').map(Number);
  const esFin = d === ultimoDia(y, m - 1);
  if (n <= 1) return new Date(y, m - 1, d);
  if (per === 'semanal') return new Date(y, m - 1, d + (n - 1) * 7);
  if (per === 'quincenal') {
    let desp = Math.floor((n - 1) / 2);
    if (n % 2 === 0 && (esFin || d > 15)) desp += 1;
    const b = new Date(y, m - 1 + desp, 1), Y = b.getFullYear(), M = b.getMonth(), ult = ultimoDia(Y, M);
    if (esFin || d === 15) return new Date(Y, M, ((n % 2 === 1) === esFin) ? ult : 15);
    if (n % 2 === 1) return new Date(Y, M, Math.min(d, ult));
    if (d < 15) return new Date(Y, M, Math.min(d + 15, ult));
    return new Date(Y, M, d - 15);
  }
  const b = new Date(y, m - 1 + (n - 1), 1), Y = b.getFullYear(), M = b.getMonth(), ult = ultimoDia(Y, M);
  return new Date(Y, M, esFin ? ult : Math.min(d, ult));
}
// Próximos cortes de nómina (15 y fin de mes) a partir de hoy
function proximosCortes(cuantos) {
  const hoy = hoyMX();
  const [y, m] = hoy.split('-').map(Number);
  const res = [];
  for (let k = 0; res.length < cuantos && k < 6; k++) {
    const b = new Date(y, m - 1 + k, 1), Y = b.getFullYear(), M = b.getMonth();
    for (const d of [15, ultimoDia(Y, M)]) {
      const iso = isoLocal(new Date(Y, M, d));
      if (iso >= hoy && res.length < cuantos) res.push(iso);
    }
  }
  return res;
}

const MOTIVO = (etiqueta, rapidos) => `
  <label for="dlgTexto">${etiqueta}</label>
  ${rapidos ? `<div class="rapidos">${rapidos.map(r => `<button type="button" data-rapido="${esc(r)}">${esc(r)}</button>`).join('')}</div>` : ''}
  <textarea id="dlgTexto" maxlength="500"></textarea>`;

function leerMotivo(dlg, obligatorio) {
  const v = $('#dlgTexto', dlg).value.trim();
  if (obligatorio && v.length < 5) throw new Error('Escribe el motivo (al menos 5 caracteres) o elige uno de los sugeridos.');
  return v || null;
}

        const fechas = [1, 2, 3].filter(k => k <= n).map(k => fechaCorta(isoLocal(fechaCuota(f, s.periodicidad, k))));

          fechas.join(', ') + (n > 3 ? ' … último el ' + ultima : '');
        vista.hidden = false;

        const avisos = [];
        const [y, m, d] = f.split('-').map(Number);
        if (s.periodicidad === 'quincenal' && d !== 15 && d !== ultimoDia(y, m - 1)) {
          const otro = d < 15 ? 'el ' + (d + 15) : 'el ' + (d - 15) + ' del mes siguiente';
          avisos.push(`No es un corte de nómina (15 o fin de mes). Los cobros serán el ${d} y ${otro}.`);
        }
        if (f < hoyMX()) avisos.push('La fecha ya pasó: las cuotas anteriores a hoy aparecerán como vencidas hasta que registres sus cobros.');

    recoger: (dlg) => {
      if (!$('#chkEnganche', dlg).checked || !$('#chkQuentli', dlg).checked)

      if ((inp.min && f < inp.min) || (inp.max && f > inp.max))
        throw new Error('La fecha del primer cobro debe estar entre ' + fechaCorta(inp.min) + ' y ' + fechaCorta(inp.max) + '.');
      const extra = leerMotivo(dlg, false);
      return {
        p_referencia_quentli: ref,
        p_fecha_primer_cobro: f,
        p_comentario: 'Enganche y alta en Quentli confirmados' + (extra ? '. ' + extra : ''),
      };

  },

function advertenciasAprobar(s, c) {
  let html = '';
  const ingreso = Number(c.ingreso_mensual_neto) || 0;
  const pagoMes = Number(s.pago_periodico) * (COBROS_AL_MES[s.periodicidad] || 1);
  if (ingreso > 0 && pagoMes / ingreso > LIMITE_INGRESO)
    html += `<div class="alerta-caja">El pago mensual equivale al ${(pagoMes / ingreso * 100).toFixed(1)}% del ingreso neto, arriba del límite del 30%.</div>`;
  const libre = ingreso - (Number(c.gastos_mensuales) || 0);
  if (libre <= 0)
    html += `<div class="alerta-caja">Los gastos declarados igualan o superan su ingreso neto.</div>`;
  else if (pagoMes / libre > LIMITE_INGRESO)
    html += `<div class="alerta-caja">El pago mensual equivale al ${(pagoMes / libre * 100).toFixed(1)}% de su ingreso libre.</div>`;
  const otras = (fichaActual.otras_solicitudes || []).filter(o => VIGENTES.includes(o.estado));
  if (otras.length)
    html += `<div class="alerta-caja">Esta persona tiene ${otras.length} ${otras.length === 1 ? 'otra solicitud vigente' : 'otras solicitudes vigentes'}.</div>`;
  return html;
}

function ejecutarAccion(tipo) {
  const cfg = ACCIONES[tipo];
  const s = fichaActual.solicitud, c = fichaActual.colaborador;
  const dlg = $('#dlg');

  let advertencias = tipo === 'aprobar' ? advertenciasAprobar(s, c) : '';
  if (s.es_prueba) advertencias += `<div class="alerta-caja">Es una solicitud de prueba.</div>`;

  dlg.innerHTML = `
    <form method="dialog" novalidate>
      <h2 id="dlgTitulo">${cfg.titulo}</h2>
      <p class="nota" style="margin:0">${cfg.texto}</p>
      <div class="resumen">
        <div><span>Folio</span><span>${esc(s.folio)}</span></div>
        <div><span>Colaborador</span><span>${esc(c.nombre_completo)}</span></div>
        <div><span>Producto</span><span>${esc(s.producto)}</span></div>
        <div><span>Financiado</span><span class="num">${mxn(s.monto_financiado)}</span></div>
      </div>
      ${advertencias}
      ${cfg.formulario(s)}
      <div class="err" id="dlgError" role="alert" hidden></div>
      <div class="pie">
        <button class="btn btn-neutro" type="button" id="dlgCerrar">Volver</button>
        <button class="btn ${cfg.claseBoton}" type="button" id="dlgConfirmar">${cfg.boton}</button>
      </div>
    </form>`;

  const err = $('#dlgError', dlg), ok = $('#dlgConfirmar', dlg), txt = $('#dlgTexto', dlg);
  dlg.querySelectorAll('[data-rapido]').forEach(b => b.addEventListener('click', () => {
    txt.value = b.dataset.rapido + (txt.value && !txt.value.startsWith(b.dataset.rapido) ? '. ' + txt.value : '');
    txt.focus();
  }));
  if (cfg.preparar) cfg.preparar(dlg, s);
  $('#dlgCerrar', dlg).addEventListener('click', () => dlg.close());

  ok.addEventListener('click', async () => {
    let params;
    try {
      params = cfg.recoger(dlg);
    } catch (e) {
      err.textContent = e.message; err.hidden = false;
      return;
    }
    err.hidden = true;
    ok.disabled = true;
    ok.innerHTML = '<span class="giro" aria-hidden="true"></span>Guardando';
    try {
      await rpc(cfg.funcion, Object.assign({ p_solicitud_id: s.id }, params));
      dlg.close();
      aviso(cfg.exito(s.folio));
      estado.resumen = null;
      vistaFicha(s.id);
    } catch (e) {
      if (e.message === 'Sesión no válida') { dlg.close(); return; }
      err.textContent = e.message;
      err.hidden = false;
      ok.disabled = false;
      ok.textContent = cfg.boton;
    }
  });

  dlg.showModal();
  const primero = dlg.querySelector('input, textarea');
  if (primero) setTimeout(() => primero.focus(), 30);
}

  cargarBandeja();
}

function pintarRecorrido() {
  const cuentas = (estado.resumen && estado.resumen.por_estado) || {};
  const rec = $('#recorrido');
  if (!rec) return;

  rec.innerHTML = ETAPAS.map(e => {
    const n = cuentas[e.id] || 0;
    return `<button type="button" class="etapa ${n ? '' : 'vacia'}" data-estado="${e.id}"
              aria-pressed="${estado.filtroEstado === e.id}">
              <span class="cuenta num">${estado.resumen ? n : '–'}</span>
              <span class="nom">${e.nombre}</span>
            </button>`;
  }).join('');

  $('#cerradas').innerHTML =
    '<span class="rotulo">Cerradas</span>' +
    CERRADAS.map(e => `<button type="button" class="ficha-filtro" data-estado="${e.id}"
        aria-pressed="${estado.filtroEstado === e.id}">${e.nombre}<b class="num">${estado.resumen ? (cuentas[e.id] || 0) : '–'}</b></button>`).join('') +
    `<button type="button" class="ficha-filtro" data-estado="todas" aria-pressed="${estado.filtroEstado === null}">Todas</button>`;

  document.querySelectorAll('#recorrido [data-estado], #cerradas [data-estado]').forEach(b =>
    b.addEventListener('click', () => {
      if (b.dataset.estado === 'todas') { estado.filtroEstado = null; pintarRecorrido(); cargarBandeja(); }
      else elegirEstado(b.dataset.estado);
    }));

  const r = estado.resumen;
  $('#cifras').innerHTML = r ? `
      <div class="cifra"><span class="v num">${mxnCorto(r.cartera_saldo)}</span><span class="l">Saldo en cobranza</span></div>
      <div class="cifra ${Number(r.cartera_vencida) > 0 ? 'alerta' : ''}"><span class="v num">${mxnCorto(r.cartera_vencida)}</span><span class="l">Monto vencido</span></div>
      <div class="cifra ${Number(r.creditos_con_atraso) > 0 ? 'alerta' : ''}"><span class="v num">${r.creditos_con_atraso} de ${r.creditos_en_cobro}</span><span class="l">Créditos con atraso</span></div>`
    : `<div class="cifra"><span class="v">–</span><span class="l">Saldo en cobranza</span></div>
       <div class="cifra"><span class="v">–</span><span class="l">Monto vencido</span></div>
       <div class="cifra"><span class="v">–</span><span class="l">Créditos con atraso</span></div>`;
}

async function cargarTodo() {
  await Promise.all([cargarResumen(), cargarBandeja()]);
}

async function cargarResumen() {
  try {
    estado.resumen = await rpc('fn_panel_resumen', { p_incluir_prueba: estado.incluirPrueba });
    pintarRecorrido();
  } catch (e) {
    if (e.message !== 'Sesión no válida') aviso(e.message, 'error');
  }
}

let turnoBandeja = 0;   // descarta respuestas viejas si el operador teclea rápido
async function cargarBandeja() {
  const lista = $('#lista');
  if (!lista) return;
  const turno = ++turnoBandeja;

  const nombreFiltro = estado.filtroEstado
    ? (ETAPAS.concat(CERRADAS).find(e => e.id === estado.filtroEstado) || {}).nombre
    : 'Todas las solicitudes';
  $('#tituloLista').textContent = nombreFiltro;
  $('#metaLista').textContent = 'Cargando…';
  lista.innerHTML = '<div class="esqueleto"></div><div class="esqueleto"></div><div class="esqueleto"></div>';

  try {
    const datos = await rpc('fn_panel_bandeja', {
      p_estado: estado.filtroEstado,
      p_buscar: estado.buscar || null,
      p_incluir_prueba: estado.incluirPrueba,
    });
    if (turno !== turnoBandeja) return;
    estado.bandeja = datos || [];
    pintarBandeja();
  } catch (e) {
    if (turno !== turnoBandeja) return;
    $('#metaLista').textContent = '';
    lista.innerHTML = `<div class="vacio"><strong>No se pudo cargar la bandeja</strong>${esc(e.message)}</div>`;
  }
}

function pintarBandeja() {
  const filas = estado.bandeja;
  const lista = $('#lista');
  const n = filas.length;

  $('#metaLista').textContent = n === 0 ? '' :
    n + (n === 1 ? ' solicitud' : ' solicitudes') +
    (estado.buscar ? ' que coinciden con “' + estado.buscar + '”' : '') +
    (n >= 500 ? '. Se muestran las 500 más recientes: usa la búsqueda para acotar.' : '');

  if (n === 0) {
    let msg;
    if (estado.buscar)                         msg = '<strong>Sin coincidencias</strong>Revisa el folio, el nombre o la CURP.';
    else if (estado.filtroEstado === 'solicitada') msg = '<strong>No hay solicitudes por decidir</strong>Las nuevas aparecerán aquí en cuanto un colaborador genere su solicitud.';
    else                                       msg = '<strong>No hay solicitudes en esta etapa</strong>';
    if (!estado.incluirPrueba) msg += '<br><br>Los datos de prueba están ocultos.';
    lista.innerHTML = '<div class="vacio">' + msg + '</div>';
    return;
  }

  lista.innerHTML =
    `<div class="encabezado-lista"><span>Folio</span><span>Colaborador</span><span>Producto</span><span>Estado</span><span>Financiado</span></div>` +
    filas.map(s => {
      const enCobro = ['formalizada', 'activa', 'liquidada'].includes(s.estado);
      const vencidas = Number(s.cuotas_vencidas) || 0;
      return `
      <a class="fila" href="#solicitud/${esc(s.solicitud_id)}">
        <span class="c-folio folio">${esc(s.folio)}</span>
        <span class="quien"><span class="nom-col">${esc(s.nombre_completo)}</span><span class="empresa">${esc(s.empresa || 'Empresa sin nombre')}</span></span>
        <span class="monto num">${mxn(s.monto_financiado)}</span>
        <span class="detalle">${esc(s.producto)}</span>
        <span class="lado num">${s.numero_pagos} pagos ${PERIODO[s.periodicidad] || esc(s.periodicidad)}</span>
        <span class="marcas">
          <span class="folio num" data-movil>${esc(s.folio)}</span>
          <span class="estado e-${esc(s.estado)}">${NOMBRE_ESTADO[s.estado] || esc(s.estado)}</span>
          ${s.es_prueba ? '<span class="marca-prueba">Prueba</span>' : ''}
          ${enCobro ? `<span class="marca-saldo num">Saldo ${mxn(s.saldo)}</span>` : ''}
          ${vencidas > 0 ? `<span class="marca-atraso">${vencidas} ${vencidas === 1 ? 'cuota vencida' : 'cuotas vencidas'}</span>` : ''}
          <span class="marca-saldo" data-movil>${hace(s.fecha_solicitud)}</span>
        </span>
      </a>`;
    }).join('');
}

/* ============================================================
   ARRANQUE
   ============================================================ */
(async function iniciar() {
  const { data } = await db.auth.getSession();
  if (data && data.session) await entrar();
  else mostrarAcceso();
})();

// Si la sesión se cierra en otra pestaña o expira, regresa al acceso
db.auth.onAuthStateChange((evento) => {
  if (evento === 'SIGNED_OUT' && !$('#vistaApp').hidden) {
    mostrarAcceso('La sesión se cerró.', 'info');
  }
});
</script>
